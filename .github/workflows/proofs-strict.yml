name: proofs-strict

# Phase 399 — the proof leg's STRICT run, on a schedule.
#
# The `proofs` job in ci.yml runs the leg on every push. This workflow runs it with -Strict once a
# week and on demand. That run is the RECORDED one: every run of the leg writes its run verdict to
# proofs/obj/last-run.json (Phase 522; what the record holds and what makes a run red are the kit
# engine's header, proofs/kit/check-proof-leg.ps1, "THE RUN VERDICT"), and a green strict full run
# also writes that record, with the tree it verified, to proofs/last-strict.json. This workflow
# summarises the run FROM THE RECORD, never from the log, and uploads both. It commits nothing; a
# maintainer who wants `check.ps1 -Since` to lean on this run downloads the `strict-baseline`
# artefact and commits the file.
#
# It never runs on a push or a tag: the strict leg is too slow to gate a push, and the publish
# workflow already runs the leg on the tagged commit.
on:
  schedule:
    # Mondays, 04:17 UTC — off the hour, when runners are least contended.
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict:
    name: proofs strict (windows-latest)
    # Windows because the budgets in modules.json were measured on Windows, so the cost trend is read
    # against numbers from the same OS.
    runs-on: windows-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      # At the pin, as in ci.yml (Phase 394).
      - name: Read the corpus pin (copies.json `corpus`)
        id: corpus-pin
        shell: pwsh
        run: ./.github/scripts/corpus-pin.ps1
      - name: Check out the wire-format conformance corpus at the pin
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.corpus-pin.outputs.repository }}
          ref: ${{ steps.corpus-pin.outputs.sha }}
          path: wire-format-fixtures
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Cache the pinned F* release
        uses: actions/cache@v4
        with:
          path: proofs/.fstar
          key: fstar-${{ runner.os }}-${{ hashFiles('proofs/fstar-pin.json') }}
      - name: Strict proof leg (./proofs/check.ps1 -Runs 3 -Strict)
        shell: pwsh
        env:
          FUARAN_CORE_CORPUS_FRESHNESS: '1'
          FUARAN_CORE_CORPUS_DIR: ${{ github.workspace }}/wire-format-fixtures
        # A child pwsh, so every line the leg prints reaches the log file, and the exit code read
        # below is the leg's own: seeded first, so a step that ran nothing cannot read green.
        run: |
          $global:LASTEXITCODE = 0
          pwsh -NoProfile -File ./proofs/check.ps1 -Runs 3 -Strict 2>&1 | Tee-Object -FilePath proofs-strict.log
          exit $LASTEXITCODE
      - name: Summarise the run from its verdict record (proofs/obj/last-run.json)
        if: always()
        shell: pwsh
        run: |
          $path = 'proofs/obj/last-run.json'
          $record = if (Test-Path $path) { Get-Content $path -Raw | ConvertFrom-Json } else { $null }
          $summary = @()
          if ($null -eq $record) {
            $summary += '## Strict proof leg: RED, and the leg wrote no run verdict'
            $summary += ''
            $summary += 'A run that leaves no record was killed before any exit path ran; read the log artefact.'
          }
          else {
            $state = if ($record.verdict -eq 'green' -and $record.refusals -eq 'held') { 'green' } else { 'RED' }
            $summary += "## Strict proof leg: $state ($($record.verdict), exit $($record.exit); refusal tests $($record.refusals))"
            $summary += ''
            if ($record.message) { $summary += '```'; $summary += $record.message; $summary += '```'; $summary += '' }
            $findings = @($record.findings)
            $summary += "### $($findings.Count) cost finding(s) against ``proofs/modules.json``"
            $summary += 'Recorded, never red: the kit engine''s header says why, and what to do about a module over budget week after week.'
            $summary += ''
            $summary += '```'
            $summary += $(if ($findings.Count -gt 0) { $findings | ForEach-Object { "run $($_.run): $($_.text)$($_.label)" } } else { '(none)' })
            $summary += @($record.contention) | ForEach-Object { "contention, run $($_.run): $(if ($null -ne $_.factor) { 'x{0:0.00}' -f $_.factor } else { 'not computed' })$(if ($_.contended) { ' (contended)' })" }
            $summary += '```'
          }
          $summary -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - name: Upload the refreshed strict baseline
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: strict-baseline
          path: proofs/last-strict.json
          if-no-files-found: error
      - name: Upload the run verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proofs-strict-verdict
          path: proofs/obj/last-run.json
          if-no-files-found: warn
      - name: Upload the leg's log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proofs-strict-log
          path: proofs-strict.log
          if-no-files-found: warn
