name: proofs-strict

# Phase 399 — the proof leg's STRICT run, on a schedule.
#
# The `proofs` job in ci.yml runs `./proofs/check.ps1 -Runs 3` WITHOUT -Strict, deliberately: a
# budget overshoot on a busy runner is a warning, because prover time varies by machine and by load
# (proofs/README.md, "What the leg costs"). That is the right default for a push, and it is also why
# a real regression could stay a warning forever. This workflow is the counterpart: once a week, and
# on demand, it runs the same leg with -Strict, so every UNLABELLED cost finding (one the run's
# contention factor does not explain) turns the run red.
#
# A RED run is a named COST finding against proofs/modules.json. The job summary lists each one,
# and the remedy is the recorded act the README describes: re-measure on a quiet machine, then
# re-seed that module's budgetSeconds / measuredSeconds with your phase and a note saying what grew.
#
# A GREEN run records the strict baseline, proofs/last-strict.json — the tree it verified, the
# machine, and each run's contention factor — and uploads it as the `strict-baseline` artefact.
# The workflow commits nothing: a maintainer who wants `check.ps1 -Since` to lean on this run
# downloads the artefact and commits the file. It is green only over the tree the run verified, so a
# baseline from a commit `main` has since moved past still stands for every module the move did not
# touch, and `-Since` names any it did.
#
# It never runs on a push or a tag: the strict leg is too slow to gate a push, and the publish
# workflow already runs the leg on the tagged commit.
on:
  schedule:
    # Mondays, 04:17 UTC — off the hour, when runners are least contended.
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict:
    name: proofs strict (windows-latest)
    # Windows because that is the OS the floors in modules.json were seeded on (`floorSeeding.os`),
    # so the floors are enforced here as well as the budgets.
    runs-on: windows-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      # At the pin, as in ci.yml (Phase 394).
      - name: Read the corpus pin (copies.json `corpus`)
        id: corpus-pin
        shell: pwsh
        run: ./.github/scripts/corpus-pin.ps1
      - name: Check out the wire-format conformance corpus at the pin
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.corpus-pin.outputs.repository }}
          ref: ${{ steps.corpus-pin.outputs.sha }}
          path: wire-format-fixtures
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Cache the pinned F* release
        uses: actions/cache@v4
        with:
          path: proofs/.fstar
          key: fstar-${{ runner.os }}-${{ hashFiles('proofs/fstar-pin.json') }}
      - name: Strict proof leg (./proofs/check.ps1 -Runs 3 -Strict)
        shell: pwsh
        env:
          FUARAN_CORE_CORPUS_FRESHNESS: '1'
          FUARAN_CORE_CORPUS_DIR: ${{ github.workspace }}/wire-format-fixtures
        # A child pwsh, so every line the leg prints reaches the log file, and the exit code read
        # below is the leg's own: seeded first, so a step that ran nothing cannot read green.
        run: |
          $global:LASTEXITCODE = 0
          pwsh -NoProfile -File ./proofs/check.ps1 -Runs 3 -Strict 2>&1 | Tee-Object -FilePath proofs-strict.log
          exit $LASTEXITCODE
      - name: Name the cost findings
        if: failure()
        shell: pwsh
        run: |
          $lines = if (Test-Path proofs-strict.log) { Get-Content proofs-strict.log } else { @() }
          $cost = @($lines | Where-Object { $_ -match '==== proofs: COST' -or $_ -match 'cost finding\(s\) against the budgets' -or $_ -match 'cost budget is exceeded' -or $_ -match 'CONTENDED PASS' })
          $verdict = @($lines | Where-Object { $_ -match '^==== proofs: ' }) | Select-Object -Last 1
          $summary = @('## The strict proof leg is red', '')
          if ($cost.Count -gt 0) {
            $summary += 'A **COST** finding against `proofs/modules.json`: a module ran over its budget on a run the contention factor does not explain.'
            $summary += 'Re-measure on a quiet machine, then re-seed its `budgetSeconds` / `measuredSeconds` with your phase and a note saying what grew (`proofs/README.md`, "What the leg costs").'
            $summary += ''
            $summary += '```'
            $summary += $cost
            $summary += '```'
          }
          else {
            $summary += 'Not a cost finding: the leg failed before its cost verdict. Its last verdict line:'
            $summary += ''
            $summary += '```'
            $summary += $(if ($verdict) { $verdict } else { '(no verdict line; read the log artefact)' })
            $summary += '```'
          }
          $summary -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - name: Upload the refreshed strict baseline
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: strict-baseline
          path: proofs/last-strict.json
          if-no-files-found: error
      - name: Upload the leg's log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proofs-strict-log
          path: proofs-strict.log
          if-no-files-found: warn
