name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Phase 395 — both configurations, because they ship differently: Debug is the contributor's own
  # path (`./verify.ps1`), Release is what publish-packages verifies and then packs `--no-build`. A
  # Release-only red (an optimiser-sensitive test, a Release-only surface difference) would otherwise
  # first show on a tag push, when the version is already named; the second leg costs a build and a
  # run in parallel and moves that red to the commit that caused it.
  verify:
    name: verify (${{ matrix.configuration }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      # The package-roster checks (Phases 199 and 205) read the repository's RELEASE TAGS and
      # refuse an empty tag list on purpose — with none, their comparisons would pass vacuously.
      # The default checkout is depth 1 with no tags, so this job was red on every push from
      # Phase 199 onward while the same gate was green on any full clone. Fetch the history and
      # the tags; the repository is small and the job already spends minutes building.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      # The wire-format conformance corpus is a BUILD INPUT to the live-corpus leg, not an
      # optional extra (Phase 130): once that leg is asked for, an absent corpus FAILS
      # rather than skipping, because a skip is how four consecutive gates reported green
      # over a corpus none of them had read. Since Phase 172 the default suite is
      # self-contained — Core's own vectors are committed under conformance/ and certified
      # from there — and the leg that reads the corpus (copy freshness, the proof-oracle
      # pools over the domain's fixtures, the drift guards) is opt-in by name. CI asks for
      # it on every push, so the corpus is checked out here and named explicitly below.
      #
      # Checked out INSIDE the workspace because actions/checkout refuses a path outside it;
      # .gitignore carries the directory so the tree stays clean either way.
      #
      # Phase 394 — at the PINNED commit, never at whatever the corpus's default branch holds. The
      # pin is the `corpus` record of copies.json; the step below reads it and refuses an absent or
      # malformed record by name, so the checkout never runs unpinned. A corpus push therefore
      # cannot red this repository's main: only a change here, or a deliberate pin bump committed
      # with the change that needs it, can (docs/conformance-corpus.md, "Bumping the pin").
      - name: Read the corpus pin (copies.json `corpus`)
        id: corpus-pin
        shell: pwsh
        run: ./.github/scripts/corpus-pin.ps1
      - name: Check out the wire-format conformance corpus at the pin
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.corpus-pin.outputs.repository }}
          ref: ${{ steps.corpus-pin.outputs.sha }}
          path: wire-format-fixtures
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # The repo green gate — the same command contributors run locally, so CI and
      # local never diverge: tool restore + fantomas --check + build + tests + the adoption
      # sample. No Fable compiler runs here (Phase 217): the "Fable-clean on encode AND decode"
      # claim is gated in fuaran-dotnet's tests/core-fable/ (STABILITY.md "Fable cleanliness").
      #
      # FUARAN_CORE_CORPUS_FRESHNESS asks for the live-corpus leg (Phase 172); without it
      # every corpus-reading leg reports itself not asked for and CI would stop comparing
      # against the corpus while staying green — the Phase 130 defect in a new coat.
      # FUARAN_CORE_CORPUS_DIR names the checkout above rather than leaving the suite to
      # anchor and climb. The climb would find it here too, so this is not load-bearing for
      # the run — it is load-bearing for the failure: if the checkout step is ever removed or
      # renamed, the suite says which directory it was told to read instead of reporting a
      # search that came up empty. It is also the form docs/conformance-corpus.md hands a
      # contributor whose clone lives somewhere else.
      #
      # Two suite families run here with NO environment at all, by design (Phase 294): the proof
      # coverage scheduling clause reads its open-phase list from the committed
      # tests/Fuaran.Core.Tests/open-phases.json, and the publication-boundary sweep reads the committed
      # tests/Fuaran.Core.Tests/publication-boundary.json over every tracked file. A gate whose
      # verdict depended on a variable this job never set would be a clause that cannot be red here.
      - name: Verify (./verify.ps1 -Configuration ${{ matrix.configuration }})
        shell: pwsh
        env:
          FUARAN_CORE_CORPUS_FRESHNESS: '1'
          FUARAN_CORE_CORPUS_DIR: ${{ github.workspace }}/wire-format-fixtures
        run: ./verify.ps1 -Configuration ${{ matrix.configuration }}

  # Phase 131 — the proof leg. proofs/DagFold.fst is checked by the PINNED F*/Z3 three times
  # from a cold cache (exit criterion 1: reproducible), the committed F# oracle is held to a fresh
  # extraction, and the Proofs.Oracle differential family runs the extracted model beside the
  # production fold (exit criterion 2: agrees). The prover is cached by the pin file's hash, per
  # OS, so a push that does not move the pin downloads nothing. The corpus is checked out for the
  # family's ops/ leg, as in `verify`.
  #
  # Phase 393 — on TWO operating systems. The pin carries a `windows` and a `linux` entry for the
  # same release, and the kit resolves the one for the runner's OS and refuses an OS with none by
  # name; running both is what keeps the second entry true. A pin bump that moved only one entry,
  # or a leg change that only works on one OS, is red here on the push that made it, not on the day
  # someone first needs the other runner. publish-packages.yml runs the same leg on the tagged
  # commit before it packs.
  #
  # Phase 399 — WITHOUT -Strict: a budget overshoot is a recorded finding on every leg and never a red
  # one (DECISIONS.md D130), and the strict run's job is the record. proofs-strict.yml runs the same
  # leg with -Strict weekly and on demand, trends the cost findings and refreshes
  # proofs/last-strict.json. Both legs refuse a probable cached read (modules.json `cachedRead`).
  # The prover the cache below misses on is fetched from the pin's `url`, then from its `mirror`.
  proofs:
    name: proofs (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      # At the pin, as in `verify` (Phase 394).
      - name: Read the corpus pin (copies.json `corpus`)
        id: corpus-pin
        shell: pwsh
        run: ./.github/scripts/corpus-pin.ps1
      - name: Check out the wire-format conformance corpus at the pin
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.corpus-pin.outputs.repository }}
          ref: ${{ steps.corpus-pin.outputs.sha }}
          path: wire-format-fixtures
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Cache the pinned F* release
        uses: actions/cache@v4
        with:
          path: proofs/.fstar
          key: fstar-${{ runner.os }}-${{ hashFiles('proofs/fstar-pin.json') }}
      - name: Proof leg (./proofs/check.ps1 -Runs 3)
        shell: pwsh
        env:
          # The host step's Proofs.Oracle pools over the corpus's ops/ and nodes/ are live-corpus
          # legs (Phase 172): asked for by name. (The Proofs.Vocabulary generation diff reads the
          # test project's own vocabularies since Phase 173 and needs no corpus.)
          FUARAN_CORE_CORPUS_FRESHNESS: '1'
          FUARAN_CORE_CORPUS_DIR: ${{ github.workspace }}/wire-format-fixtures
        run: ./proofs/check.ps1 -Runs 3
