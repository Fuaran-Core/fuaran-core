name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # The package-roster checks (Phases 199 and 205) read the repository's RELEASE TAGS and
      # refuse an empty tag list on purpose — with none, their comparisons would pass vacuously.
      # The default checkout is depth 1 with no tags, so this job was red on every push from
      # Phase 199 onward while the same gate was green on any full clone. Fetch the history and
      # the tags; the repository is small and the job already spends minutes building.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      # The wire-format conformance corpus is a BUILD INPUT to the live-corpus leg, not an
      # optional extra (Phase 130): once that leg is asked for, an absent corpus FAILS
      # rather than skipping, because a skip is how four consecutive gates reported green
      # over a corpus none of them had read. Since Phase 172 the default suite is
      # self-contained — Core's own vectors are committed under conformance/ and certified
      # from there — and the leg that reads the corpus (copy freshness, the proof-oracle
      # pools over the domain's fixtures, the drift guards) is opt-in by name. CI asks for
      # it on every push, so the corpus is checked out here and named explicitly below.
      #
      # Checked out INSIDE the workspace because actions/checkout refuses a path outside it;
      # .gitignore carries the directory so the tree stays clean either way.
      - name: Check out the wire-format conformance corpus
        uses: actions/checkout@v4
        with:
          repository: fuaran-ui/fuaran-ui-specification
          path: wire-format-fixtures
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # The repo green gate — the same command contributors run locally, so CI and
      # local never diverge: tool restore + fantomas --check + build + the Fable-compile
      # gate (the "Fable-clean on encode AND decode" claim) + tests + the adoption sample.
      #
      # FUARAN_CORE_CORPUS_FRESHNESS asks for the live-corpus leg (Phase 172); without it
      # every corpus-reading leg reports itself not asked for and CI would stop comparing
      # against the corpus while staying green — the Phase 130 defect in a new coat.
      # FUARAN_CORE_CORPUS_DIR names the checkout above rather than leaving the suite to
      # anchor and climb. The climb would find it here too, so this is not load-bearing for
      # the run — it is load-bearing for the failure: if the checkout step is ever removed or
      # renamed, the suite says which directory it was told to read instead of reporting a
      # search that came up empty. It is also the form docs/conformance-corpus.md hands a
      # contributor whose clone lives somewhere else.
      - name: Verify (./verify.ps1)
        shell: pwsh
        env:
          FUARAN_CORE_CORPUS_FRESHNESS: '1'
          FUARAN_CORE_CORPUS_DIR: ${{ github.workspace }}/wire-format-fixtures
        run: ./verify.ps1

  # Phase 131 — the proof leg. proofs/DagFold.fst is checked by the PINNED F*/Z3 three times
  # from a cold cache (exit criterion 1: reproducible), the committed F# oracle is held to a fresh
  # extraction, and the Proofs.Oracle differential family runs the extracted model beside the
  # production fold (exit criterion 2: agrees). Windows because that is the release the pin
  # names; the prover is cached by the pin file's hash so a push that does not move the pin
  # downloads nothing. The corpus is checked out for the family's ops/ leg, as in `verify`.
  proofs:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the wire-format conformance corpus
        uses: actions/checkout@v4
        with:
          repository: fuaran-ui/fuaran-ui-specification
          path: wire-format-fixtures
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Cache the pinned F* release
        uses: actions/cache@v4
        with:
          path: proofs/.fstar
          key: fstar-${{ runner.os }}-${{ hashFiles('proofs/fstar-pin.json') }}
      - name: Proof leg (./proofs/check.ps1 -Runs 3)
        shell: pwsh
        env:
          # The host step's Proofs.Oracle pools over the corpus's ops/ and nodes/ are live-corpus
          # legs (Phase 172): asked for by name. (The Proofs.Vocabulary generation diff reads the
          # test project's own vocabularies since Phase 173 and needs no corpus.)
          FUARAN_CORE_CORPUS_FRESHNESS: '1'
          FUARAN_CORE_CORPUS_DIR: ${{ github.workspace }}/wire-format-fixtures
        run: ./proofs/check.ps1 -Runs 3
