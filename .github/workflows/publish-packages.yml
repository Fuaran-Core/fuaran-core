name: publish-packages

# Released distribution channel for the Fuaran.Core.* packs: nuget.org — the
# public, no-auth-restore channel. Bump <Version> in Directory.Build.props,
# commit, then tag vX.Y.Z and push the tag to trigger this workflow.
# Re-runs of the same tag are idempotent (--skip-duplicate).
#
# Phase 294 — a publish is the repository's own gate plus a tag that names what is packed:
#   1. the ref must be a tag (a workflow_dispatch run on a branch is refused, because no version
#      can be checked against a branch), and the tag must be `v<Version>` for the <Version> in
#      Directory.Build.props — a mistyped tag packs the standing version under the wrong name;
#   2. `verify.ps1 -Configuration Release` runs before anything is packed, with the same inputs the ci
#      workflow gives it, and the pack that follows is `--no-build` over THAT output (Phase 395): the
#      assemblies the gate's surface and documentation checks read are the assemblies that ship, not a
#      second build of the same sources.
#
# Phase 393 — a publish is gated by the PROOF LEG and checked against the registry:
#   3. the `proofs` job runs `proofs/check.ps1 -Runs 3`, the ci workflow's leg WITH its host step
#      (ci passes -SkipOracleHost because its `verify` matrix runs those families), on the TAGGED
#      commit, and `publish` `needs:` it — a refuted model, a drifted oracle or a red Proofs.Ladder /
#      Proofs.Coverage family stops the tag before anything is packed. A job here rather than a
#      Checks-API read of the commit's ci run (proofs/README.md, "Running it", says why): the verdict
#      is about the exact commit being packed, it cannot race a ci run still in flight, and it needs
#      no permission beyond reading the repository;
#   4. after both pushes, `.github/scripts/probe-registry.ps1` derives the packable roster (the
#      derivation the suite holds to the README table), refuses a packed set that differs from it,
#      and asks nuget.org's v3 flat container for every id at <Version>, failing the job and naming
#      each id the registry does not serve. `--skip-duplicate` keeps re-runs idempotent; the probe is
#      what says whether a re-run after a partial push actually completed the roster.
#
# Phase 536 — a publish also attaches THE PROOF KIT'S RELEASE ASSET:
#   5. the `proofs-kit` job builds `proofs-kit-<Version>.tar` with `proofs/kit/build-kit-asset.ps1`
#      (reproducible: its sha256 is a function of the kit's bytes), REFUSES to go on when that sha is
#      not `copies.json`'s committed `proofsKit.sha256`, and attaches the asset to the `v<Version>`
#      GitHub release, creating the release when the tag has none. An asset already attached is
#      downloaded and compared instead of replaced: the same bytes pass, different bytes fail the job.
#      It then downloads the asset from its public url and checks the sha once more, so what an
#      adopter's pin fetches is what was verified. Tag-only, like the rest of this workflow, and the
#      only job granted `contents: write`.
# RELEASING.md is the operator's page: the tag-and-publish mechanics, the Trusted Publishing policy
# this job's login depends on, and what a 401 at the login step means.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The ref check runs first and alone, so a mistyped tag or a branch dispatch is refused in seconds
  # rather than after the proof leg.
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse a ref that is not the tag for <Version>
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:REF_TYPE -ne 'tag') {
              throw "publish runs on a tag; this run is on $($env:REF_TYPE) '$($env:REF_NAME)'. Push vX.Y.Z, or pick that tag when dispatching."
          }
          $node = Select-Xml -Path Directory.Build.props -XPath '//PropertyGroup/Version' | Select-Object -First 1
          if ($null -eq $node) { throw 'Directory.Build.props declares no <Version>.' }
          $version = $node.Node.InnerText.Trim()
          $expected = "v$version"
          if ($env:REF_NAME -ne $expected) {
              throw "tag '$($env:REF_NAME)' does not equal the standing <Version> ($version): expected '$expected'. Nothing was packed."
          }
          Write-Host "tag $($env:REF_NAME) names <Version> $version"

  # The proof leg on the tagged commit — the ci workflow's `proofs` job, step for step, except that
  # the host step runs here: the verdict this job hands `publish` is about the exact commit packed
  # (item 3 above), and `publish`'s own verify runs only after this job is green. Windows
  # because that is the runner the leg was cut on; the pin carries a Linux entry too, so either
  # runner can run it (proofs/fstar-pin.json).
  proofs:
    needs: tag
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # At the pin the TAGGED commit's copies.json names (Phase 394), as ci.yml does — so a tag
      # certifies against exactly the corpus its own commit chose, whatever the corpus holds today.
      - name: Read the corpus pin (copies.json `corpus`)
        id: corpus-pin
        shell: pwsh
        run: ./.github/scripts/corpus-pin.ps1
      - name: Check out the wire-format conformance corpus at the pin
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.corpus-pin.outputs.repository }}
          ref: ${{ steps.corpus-pin.outputs.sha }}
          path: wire-format-fixtures
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Cache the pinned F* release
        uses: actions/cache@v4
        with:
          path: proofs/.fstar
          key: fstar-${{ runner.os }}-${{ hashFiles('proofs/fstar-pin.json') }}
      - name: Proof leg (./proofs/check.ps1 -Runs 3)
        shell: pwsh
        env:
          FUARAN_CORE_CORPUS_FRESHNESS: '1'
          FUARAN_CORE_CORPUS_DIR: ${{ github.workspace }}/wire-format-fixtures
        run: ./proofs/check.ps1 -Runs 3

  # The kit asset (item 5 above). After the proof leg, so a kit whose leg is red is never attached.
  proofs-kit:
    needs: [tag, proofs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build the kit asset and hold it to copies.json proofsKit.sha256
        shell: pwsh
        run: pwsh ./proofs/kit/build-kit-asset.ps1 -Check -OutDir "${{ runner.temp }}/kit-asset"
      - name: Attach it to the release for the tag, never replacing different bytes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:TAG.TrimStart('v')
          $asset = "proofs-kit-$version.tar"
          $built = Join-Path "${{ runner.temp }}/kit-asset" $asset
          $sha = (Get-Content copies.json -Raw | ConvertFrom-Json).proofsKit.sha256
          gh release view $env:TAG --json tagName *> $null
          if ($LASTEXITCODE -ne 0) {
              gh release create $env:TAG --verify-tag --title $env:TAG --notes "Fuaran.Core $version. The proof kit for this release is $asset, sha256 $sha (proofs/kit/README.md, Pinning the kit)."
              if ($LASTEXITCODE -ne 0) { throw "could not create the release for $($env:TAG)" }
          }
          $attached = @(gh release view $env:TAG --json assets --jq '.assets[].name')
          if ($attached -contains $asset) {
              $existing = Join-Path "${{ runner.temp }}" "attached-$asset"
              gh release download $env:TAG --pattern $asset --output $existing --clobber
              $existingSha = (Get-FileHash $existing -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($existingSha -ne $sha) { throw "$asset is already attached to $($env:TAG) with sha256 $existingSha, not the committed $sha. Nothing was replaced." }
              Write-Host "$asset is already attached with the committed sha256 $sha"
          }
          else {
              gh release upload $env:TAG $built
              if ($LASTEXITCODE -ne 0) { throw "could not attach $asset to $($env:TAG)" }
          }
      - name: Fetch the asset from its public url and check the sha once more
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:TAG.TrimStart('v')
          $url = "https://github.com/${{ github.repository }}/releases/download/$($env:TAG)/proofs-kit-$version.tar"
          $sha = (Get-Content copies.json -Raw | ConvertFrom-Json).proofsKit.sha256
          $fetched = Join-Path "${{ runner.temp }}" 'fetched-kit.tar'
          Invoke-WebRequest -Uri $url -OutFile $fetched -UseBasicParsing
          $fetchedSha = (Get-FileHash $fetched -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($fetchedSha -ne $sha) { throw "$url serves sha256 $fetchedSha, not the committed $sha" }
          Write-Host "$url serves the committed sha256 $sha"

  publish:
    needs: [tag, proofs]
    runs-on: ubuntu-latest
    # `id-token: write` lets the job request the GitHub OIDC token that nuget.org's Trusted
    # Publishing exchange turns into a short-lived API key. Granted to THIS job only (Phase 393):
    # the ref check and the proof leg run repository code and have no use for a publishing token.
    permissions:
      contents: read
      id-token: write
    steps:
      # Full history and tags: the package-roster checks in verify.ps1 read the repository's
      # release tags and refuse an empty list (see ci.yml).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # The wire-format conformance corpus is a build input of the gate's corpus leg, which is
      # asked for by name exactly as ci.yml asks for it (an absent corpus fails, never skips), and
      # checked out at the tagged commit's pin (Phase 394).
      - name: Read the corpus pin (copies.json `corpus`)
        id: corpus-pin
        shell: pwsh
        run: ./.github/scripts/corpus-pin.ps1
      - name: Check out the wire-format conformance corpus at the pin
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.corpus-pin.outputs.repository }}
          ref: ${{ steps.corpus-pin.outputs.sha }}
          path: wire-format-fixtures
      - name: Verify the Release build (./verify.ps1 -Configuration Release)
        shell: pwsh
        env:
          FUARAN_CORE_CORPUS_FRESHNESS: '1'
          FUARAN_CORE_CORPUS_DIR: ${{ github.workspace }}/wire-format-fixtures
        run: ./verify.ps1 -Configuration Release
      - name: Pack what was verified (all packable src projects, --no-build)
        run: dotnet pack Fuaran.Core.slnx -c Release --no-build -o ${{ runner.temp }}/nupkgs
      # Auth is Trusted Publishing (OIDC): a policy on nuget.org (repo owner /
      # repo / this workflow's file name) exchanges the job's OIDC token for a
      # 1-hour API key — no long-lived key secret to rotate. NUGET_USER is the
      # nuget.org profile name the policy belongs to.
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ajwillshire # the policy creator (a nuget.org profile name is public, not a secret)
      - name: Push to nuget.org
        run: >
          dotnet nuget push "${{ runner.temp }}/nupkgs/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          --skip-duplicate
      # The symbol packages (snupkg) travel beside the packages so a consumer can step into Core
      # from the registry's symbol server. A separate push: the glob above matches .nupkg only.
      - name: Push symbols to nuget.org
        run: >
          dotnet nuget push "${{ runner.temp }}/nupkgs/*.snupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          --skip-duplicate
      # Phase 393 — what landed, asked of the registry rather than inferred from two green pushes.
      # nuget.org indexes asynchronously; the probe retries on a bounded schedule and then fails
      # naming every id it does not serve (re-running the workflow re-pushes with --skip-duplicate
      # and probes again).
      - name: Probe nuget.org for every packed id at <Version>
        shell: pwsh
        run: ./.github/scripts/probe-registry.ps1 -PackagesDir "${{ runner.temp }}/nupkgs"
