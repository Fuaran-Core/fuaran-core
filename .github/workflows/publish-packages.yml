name: publish-packages

# Released distribution channels for the Fuaran.Core.* packs: nuget.org (the
# public, no-auth-restore channel) and the fuaran-ui org GitHub Packages NuGet
# feed. Bump <Version> in Directory.Build.props, commit,
# then tag vX.Y.Z-alpha.N and push the tag to trigger this workflow. Re-runs of
# the same tag are idempotent (--skip-duplicate); GH Packages refuses re-push of
# the same id+version pair, so the operator must bump the version before tagging.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  # `id-token: write` lets the job request the GitHub OIDC token that
  # nuget.org's Trusted Publishing exchange turns into a short-lived API key.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Pack (all packable src projects)
        run: dotnet pack Fuaran.Core.slnx -c Release -o ${{ runner.temp }}/nupkgs
      - name: Push to the fuaran-ui GitHub Packages feed
        run: >
          dotnet nuget push "${{ runner.temp }}/nupkgs/*.nupkg"
          --source https://nuget.pkg.github.com/fuaran-ui/index.json
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --skip-duplicate
      # nuget.org is the public distribution channel — consumers restore with
      # no credentials (GitHub Packages requires auth even for public NuGet
      # packages). Auth is Trusted Publishing (OIDC): a policy on nuget.org
      # (repo owner / repo / this workflow's file name) exchanges the job's
      # OIDC token for a 1-hour API key — no long-lived key secret to rotate.
      # NUGET_USER is the nuget.org profile name the policy belongs to.
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push to nuget.org
        run: >
          dotnet nuget push "${{ runner.temp }}/nupkgs/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          --skip-duplicate
